<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f5fb">
    <title>Weather Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app-container">
        <header>
            <p class="eyebrow">YOUR LOCAL FORECAST</p>
            <h1>Weather Finder</h1>
            <p class="intro">A little forecast for wherever you are.</p>
        </header>

        <form id="search-form">
            <label class="visually-hidden" for="city-input">City name</label>
            <input
                type="search"
                id="city-input"
                placeholder="Search a city..."
                autocomplete="address-level2"
            >
            <button id="search-btn" type="submit">Search</button>
        </form>
        <button id="location-btn" class="location-button" type="button">◎ Use my location</button>

        <p id="status-message" role="status" aria-live="polite" hidden></p>

        <section id="weather-result" aria-label="Weather forecast" hidden>
            <div class="current-weather">
                <div class="current-heading">
                    <div>
                        <p class="eyebrow">CURRENT WEATHER</p>
                        <h2 id="location-name"></h2>
                    </div>
                    <span id="weather-symbol" class="weather-symbol" aria-hidden="true">☀</span>
                </div>
                <p class="temperature"><span id="temp-value">--</span><span class="degree">°</span></p>
                <p id="condition-value" class="condition"></p>
                <div class="weather-details">
                    <p><span>Feels like</span><strong><span id="feels-like-value">--</span>°C</strong></p>
                    <p><span>Wind</span><strong><span id="wind-value">--</span> km/h</strong></p>
                </div>
            </div>

            <section class="forecast-section" aria-labelledby="forecast-heading">
                <h3 id="forecast-heading">5-day forecast</h3>
                <div id="forecast-list" class="forecast-list"></div>
            </section>
        </section>
        <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></footer>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
