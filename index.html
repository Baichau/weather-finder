<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app-container">
        <header>
            <h1>Weather Finder</h1>
            <p>Enter a city name to get the current weather conditions.</p>
        </header>

        <section id="search-section">
            <input 
                type="text" 
                id="city-input" 
                placeholder="e.g., London, Tokyo, New York..." 
                aria-label="City Name"
            >
            <button id="search-btn">Search Weather</button>
        </section>

        <section id="message-section">
            <p id="status-message" style="display: none;"></p>
        </section>

        <section id="weather-result" style="display: none;">
            <h2 id="location-name"></h2>
            <div class="weather-card">
                <p><strong>Temperature:</strong> <span id="temp-value">--</span>°C</p>
                <p><strong>Wind Speed:</strong> <span id="wind-value">--</span> km/h</p>
                <p><strong>Condition:</strong> <span id="condition-value">--</span></p>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
